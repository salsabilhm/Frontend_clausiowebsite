<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/logo.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <title>Clausio</title>

  <style>
    @keyframes logoReveal {
      0% {
        opacity: 0;
        transform: scale(0.8) translateY(20px);
        filter: blur(8px);
      }
      60% {
        transform: scale(1.03) translateY(-4px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0);
      }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(79, 70, 229, 0.3); }
      50% { box-shadow: 0 0 40px rgba(79, 70, 229, 0.6); }
    }

    .animate-logo {
      animation: logoReveal 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .animate-float {
      animation: float 3s ease-in-out infinite;
    }

    .animate-pulse-glow {
      animation: pulseGlow 2s ease-in-out infinite;
    }

    .logo-img {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .logo-img:hover {
      transform: scale(1.08) rotate(-3deg);
      filter: drop-shadow(0 10px 30px rgba(79, 70, 229, 0.4));
    }
  </style>
</head>
<body>
<div id="root">
  <!-- Page avec uniquement le logo -->
  <div class="min-h-screen flex items-center justify-center
                bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50">

    <!-- Logo -->
    <div class="relative group animate-logo">
      <!-- Effet de lueur derrière le logo -->
      <div class="absolute -inset-8 bg-gradient-to-r from-indigo-500/20 to-purple-500/20
                    rounded-full blur-2xl animate-pulse-glow">
      </div>

      <!-- Image du logo avec nom exact logo2 -->
      <img
        src="/logo2.png"
        alt="logo2"
        class="logo-img relative w-32 h-32 md:w-48 md:h-48
                 object-contain rounded-2xl
                 shadow-xl shadow-indigo-500/20
                 animate-float
                 hover:shadow-2xl hover:shadow-indigo-500/30
                 cursor-pointer"
      />
    </div>

  </div>
</div>

<script type="module" src="/src/main.tsx"></script>
</body>
</html>
